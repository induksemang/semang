name: Keep Supabase Alive
on:
    schedule:
        # Run daily at 16:00 UTC = midnight WITA. Free tier pauses after 7 days
        # idle, and GitHub cron is best-effort, so daily keeps the margin wide.
        - cron: "0 16 * * *"
    workflow_dispatch:
jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Supabase Database
              run: |
                  curl -fsS -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/provinces?select=id&limit=1" \
                  -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
                  -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
